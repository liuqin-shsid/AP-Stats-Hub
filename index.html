<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AP Stats 小站 · 线性回归教学</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand" data-i18n="brand">AP Stats 小站</div>
        <div class="header-right">
            <span class="subtitle" data-i18n="subtitle">统计学习互动工具</span>
            <button id="langToggle" class="lang-btn">English</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-title" data-i18n="sidebarTitle">学习工具</div>
            <button class="nav-item active" type="button" data-i18n="navItem">线性回归教学</button>
        </aside>
        <main class="content">
            <div class="page-heading">
                <div>
                    <h1 data-i18n="pageTitle">线性回归教学</h1>
                    <p data-i18n="pageDesc">拖动数据点，观察最佳拟合线、相关系数与 R² 的变化。</p>
                </div>
            </div>

            <section class="controls" aria-label="控制面板">
                <label><span data-i18n="selectCase">选择案例</span>
                    <select id="sheetSelect" disabled><option data-i18n="loadingData">正在读取数据…</option></select>
                </label>
                <label><span data-i18n="xVariable">X 变量</span>
                    <select id="xSelect" disabled></select>
                </label>
                <label><span data-i18n="yVariable">Y 变量</span>
                    <select id="ySelect" disabled></select>
                </label>
                <label class="check"><input id="fitToggle" type="checkbox" checked> <span data-i18n="showFitLine">显示拟合直线</span></label>
                <label class="check delete-check"><input id="deleteToggle" type="checkbox"> <span data-i18n="deleteMode">删除模式</span></label>
                <button id="resetButton" class="reset" type="button"><span data-i18n="resetData">重置数据</span></button>
            </section>

            <p id="hint" class="hint">提示：直接拖动蓝色数据点；开启删除模式后，点击数据点即可删除。</p>

            <section class="stats" aria-live="polite">
                <div id="equation" class="equation">Best Fit Line: —</div>
                <div id="metrics">R: —　|　R²: —　|　Slope: —　|　Intercept: —</div>
                <div id="count" class="count">数据点：0</div>
            </section>

            <section class="chart-card">
                <svg id="chart" viewBox="0 0 1000 610" role="img" aria-label="互动散点图"></svg>
            </section>
        </main>
    </div>

    <footer>
        <span data-i18n="footerCopyright">© 2026</span>
        <span data-i18n="footerEmail">liuqin@shsid.org</span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
